[workspace]
members = [".", "crates/unity-path-rules"]

[package]
name = "unity-assetdb"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Unity asset GUID → name index baker. Walks Assets/, parses .meta and asset YAML, writes a compact bincode database."
repository = "https://github.com/studio-boxcat/unity-assetdb"
homepage = "https://github.com/studio-boxcat/unity-assetdb"
documentation = "https://docs.rs/unity-assetdb"
readme = "README.md"
keywords = ["unity", "asset", "yaml", "gamedev", "tooling"]
categories = ["game-development", "parser-implementations", "command-line-utilities"]
exclude = ["target/", ".github/"]

[lib]
name = "unity_assetdb"
path = "src/lib.rs"

[[bin]]
name = "unity-assetdb"
path = "src/bin/unity-assetdb.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
ahash = "0.8"
anyhow = "1"
bincode = "2"
getrandom = { version = "0.2", features = ["std"] }
ignore = "0.4"
memchr = "2"
tempfile = "3"
thiserror = "2"
unity-path-rules = { version = "0.1", path = "crates/unity-path-rules" }
clap = { version = "4", features = ["derive"], optional = true }
# Shared Watchman wire layer (sync facade over watchman_client). `watch.rs`
# only pins the GUID-baker dir/suffix filter on top of this. See
# docs/refresh.md for the sync-facade pattern.
unity-watch = { git = "https://github.com/studio-boxcat/unity-watch.git" }

[dev-dependencies]
# `assert_cmd` drives the binary as a subprocess for the CLI contract
# suite (`tests/cli.rs`) — covers exit codes, stdout shape (TSV +
# `--json`), and stderr (miss + "did you mean:" suggestions). Pulls in
# `predicates` transitively for the stdout/stderr matchers.
assert_cmd = "2"

# Keep line tables in release for readable backtraces / profiler symbols.
[profile.release]
debug = "line-tables-only"
