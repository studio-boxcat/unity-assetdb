[package]
name = "unity-assetdb"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Unity asset GUID → name index baker. Walks Assets/, parses .meta and asset YAML, writes a compact bincode database."
repository = "https://github.com/studio-boxcat/unity-assetdb"
homepage = "https://github.com/studio-boxcat/unity-assetdb"
documentation = "https://docs.rs/unity-assetdb"
readme = "README.md"
keywords = ["unity", "asset", "yaml", "gamedev", "tooling"]
categories = ["game-development", "parser-implementations", "command-line-utilities"]
exclude = ["target/", ".github/"]

[lib]
name = "unity_assetdb"
path = "src/lib.rs"

[[bin]]
name = "unity-assetdb"
path = "src/bin/unity-assetdb.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
ahash = "0.8"
anyhow = "1"
bincode = "2"
fs2 = "0.4"
getrandom = { version = "0.2", features = ["std"] }
ignore = "0.4"
thiserror = "2"
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
# `filetime` exposes a portable `set_file_mtime` for the cache-integrity
# tests in tests/bake.rs — we need to drift mtimes on demand to exercise
# the warm-path fast/slow-path bake branches.
filetime = "0.2"

# Keep line tables in release so samply can symbolicate flamegraphs.
[profile.release]
debug = "line-tables-only"
